version: '3.8'

services:
  # 1. The Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: footy_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: footyauction
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. The Speed Layer (Redis)
  redis:
    image: redis:alpine
    container_name: footy_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # 3. The Visualizer (RedisInsight - Optional GUI)
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis_ui
    ports:
      - "5540:5540"

volumes:
  pg_data:
  redis_data: